services:
  # ----------------------------------------------------------------------------
  # Backend API Service (FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: chitflow-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn_conf.py app.main:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chitflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_DEMO_SEEDING
        value: "true"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: https://chitflow-web.onrender.com,http://localhost:5173

  # ----------------------------------------------------------------------------
  # Frontend Web Client (React + Vite) - Served via Global CDN (No Region)
  # ----------------------------------------------------------------------------
  - type: web
    name: chitflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://chitflow-api-weyi.onrender.com/api/v1

databases:
  # ----------------------------------------------------------------------------
  # Managed PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: chitflow-db
    region: oregon
    plan: free
    databaseName: chitflow_prod
    user: chitflow_admin

