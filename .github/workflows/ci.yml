name: ChitFlow Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test:
    name: Backend Test Suite (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Financial & Security Test Suites (29 Tests)
        env:
          PYTHONPATH: backend
          ENVIRONMENT: test
          SECRET_KEY: ci-testing-cryptographic-secret-key-32bytes-secure
        run: |
          python -m unittest discover -s backend/tests

  frontend-build:
    name: Frontend Build & Typecheck (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Build & Lint Check
        working-directory: frontend
        run: npm run build
